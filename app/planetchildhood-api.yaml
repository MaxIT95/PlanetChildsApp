openapi: 3.0.3
info:
  title: Planet Childhood API
  description: API for Planet Childhood application
  version: 0.0.1
  contact:
    name: Solarmtech
    url: https://solarmtech.ru

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.planetchildhood.ru
    description: Production server

tags:
  - name: User
    description: User management operations
  - name: Child
    description: Child management operations
  - name: CoachChildren
    description: Coach-children linking operations
  - name: DictService
    description: Dictionary services management operations
  - name: DictServicePlace
    description: Dictionary service places management operations
  - name: CoachService
    description: Coach services management operations
  - name: Event
    description: Event management operations
  - name: Schedule
    description: Schedule service management operations
  - name: CoachLinkRequest
    description: Coach link request operations (client requests to link with a coach)

paths:
  /api/user/register:
    post:
      tags:
        - User
      summary: Register a new user
      description: Creates a new user account with the provided information
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/refresh:
    post:
      tags:
        - User
      summary: Refresh access token
      description: Issues new access and refresh tokens
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Invalid refresh token

  /api/user/login:
    post:
      tags:
        - User
      summary: Authorization a user
      description: User authentication to access the service
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUserRequest'
      responses:
        '201':
          description: User successfully authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Incorrect login or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user:
    get:
      tags:
        - User
      summary: Search users with pagination
      description: |
        Retrieves a paginated list of users with optional filtering by name.
        Supports case-insensitive name search.
      operationId: getAllUsers
      security:
        - oauth2: []
      parameters:
        - name: name
          in: query
          required: false
          description: Filter users by name (case-insensitive partial match)
          schema:
            type: string
          example: Ivan
        - name: role
          in: query
          required: false
          description: Filter users by role name (e.g. ROLE_ADMIN, ROLE_COACH, ROLE_CLIENT)
          schema:
            type: string
          example: ROLE_COACH
        - name: pageNumber
          in: query
          required: false
          description: Page number (0-indexed)
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
          example: 0
        - name: pageSize
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
          example: 20
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUserResponse'
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/user/{userId}:
    get:
      tags:
        - User
      summary: Get user and profile information
      description: Retrieves detailed information about a specific user including their profile
      operationId: getUserById
      security:
        - oauth2: []
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - User
      summary: Update user and profile information
      description: |
      operationId: updateUser
      security:
        - oauth2: []
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Invalid JSON Patch operation or data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity - JSON Patch operation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - User
      summary: Delete user account
      description: Permanently deletes a user account from both the application and Keycloak
      operationId: deleteUser
      security:
        - oauth2: []
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: User deleted successfully
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/me:
    get:
      tags:
        - User
      summary: Get current user and profile information
      description: Retrieves information about the currently authenticated user including their profile
      operationId: getCurrentUser
      security:
        - oauth2: []
      responses:
        '200':
          description: Current user information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/profile/{profileId}/photo:
    put:
      tags:
        - Profile
      summary: Upload or update profile photo
      description: |
        Uploads a new profile photo or replaces an existing one.
        Accepts image files in JPEG, PNG, or WebP format.
      operationId: setProfilePhoto
      security:
        - oauth2: []
      parameters:
        - name: profileId
          in: path
          required: true
          description: Profile ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  format: binary
                  description: Profile photo image file (JPEG, PNG, WebP)
            encoding:
              photo:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Profile photo uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: Invalid image format or missing file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payload Too Large - image file exceeds size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported Media Type - invalid image format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Profile
      summary: Delete profile photo
      description: Removes the current profile photo
      operationId: deleteProfilePhoto
      security:
        - oauth2: []
      parameters:
        - name: profileId
          in: path
          required: true
          description: Profile ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Profile photo deleted successfully
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/child/add-child:
    post:
      tags:
        - Child
      summary: Add a new child
      description: Creates a new child for the currently authenticated parent
      operationId: addChild
      security:
        - oauth2: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                child:
                  $ref: '#/components/schemas/ChildRequest'
                picture:
                  type: string
                  format: binary
                  description: Child photo (JPEG, PNG, WebP)
            encoding:
              picture:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Child created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/child:
    get:
      tags:
        - Child
      summary: Get current user's children
      description: Retrieves all children for the currently authenticated parent with pagination
      operationId: getMyChildren
      security:
        - oauth2: []
      parameters:
        - name: pageNumber
          in: query
          required: false
          description: Page number (0-indexed)
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
          example: 0
        - name: pageSize
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
          example: 20
      responses:
        '200':
          description: Children retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedChildResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/child/{childId}:
    get:
      tags:
        - Child
      summary: Get child by ID
      description: Retrieves a specific child by ID
      operationId: getChildById
      security:
        - oauth2: []
      parameters:
        - name: childId
          in: path
          required: true
          description: Child ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Child retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Child not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Child
      summary: Update child
      description: Updates an existing child
      operationId: updateChild
      security:
        - oauth2: []
      parameters:
        - name: childId
          in: path
          required: true
          description: Child ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildRequest'
      responses:
        '200':
          description: Child updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Child not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Child
      summary: Delete child
      description: Deletes a child by ID
      operationId: deleteChild
      security:
        - oauth2: []
      parameters:
        - name: childId
          in: path
          required: true
          description: Child ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Child deleted successfully
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Child not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/coach-children/link-child:
    post:
      tags:
        - CoachChildren
      summary: Link a child to the current coach
      description: Creates a link between the authenticated coach and a child. Only coaches can perform this action.
      operationId: linkChild
      security:
        - oauth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkChildRequest'
      responses:
        '201':
          description: Child linked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachChildrenResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - only coaches can link children
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Child not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Child is already linked to this coach
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/coach-children:
    get:
      tags:
        - CoachChildren
      summary: Get current coach's linked children
      description: Retrieves all children linked to the currently authenticated coach with pagination
      operationId: getMyLinkedChildren
      security:
        - oauth2: []
      parameters:
        - name: pageNumber
          in: query
          required: false
          description: Page number (0-indexed)
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
          example: 0
        - name: pageSize
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
          example: 20
      responses:
        '200':
          description: Linked children retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCoachChildrenResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/coach-children/{coachChildrenId}:
    delete:
      tags:
        - CoachChildren
      summary: Unlink a child from coach
      description: Removes the link between the coach and a child
      operationId: unlinkChild
      security:
        - oauth2: []
      parameters:
        - name: coachChildrenId
          in: path
          required: true
          description: Coach-children link ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Child unlinked successfully
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/coach-link-request:
    post:
      tags:
        - CoachLinkRequest
      summary: Create a link request
      description: Creates a link request from a client (or parent) to a coach. Either clientId or childId must be provided.
      operationId: createLinkRequest
      security:
        - oauth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequestRequest'
      responses:
        '201':
          description: Link request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachLinkRequestResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Link request already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - CoachLinkRequest
      summary: Get current user's link requests
      description: Retrieves link requests for the currently authenticated user with pagination. Coaches see incoming requests, clients see their outgoing requests.
      operationId: getMyLinkRequests
      security:
        - oauth2: []
      parameters:
        - name: pageNumber
          in: query
          required: false
          description: Page number (0-indexed)
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
          example: 0
        - name: pageSize
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
          example: 20
      responses:
        '200':
          description: Link requests retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCoachLinkRequestResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/coach-link-request/{linkRequestId}:
    delete:
      tags:
        - CoachLinkRequest
      summary: Cancel or reject a link request
      description: Cancels (by client) or rejects (by coach) a link request
      operationId: deleteLinkRequest
      security:
        - oauth2: []
      parameters:
        - name: linkRequestId
          in: path
          required: true
          description: Link request ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Link request deleted successfully
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Link request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/dict-service:
    get:
      tags:
        - DictService
      summary: Search dictionary services with pagination
      description: |
        Retrieves a paginated list of dictionary services with optional filtering by name.
        Supports case-insensitive partial name search.
      operationId: searchDictServices
      security:
        - oauth2: []
      parameters:
        - name: name
          in: query
          required: false
          description: Filter services by name (case-insensitive partial match)
          schema:
            type: string
          example: Swimming
        - name: pageNumber
          in: query
          required: false
