      summary: Get event by ID
      description: Retrieves a specific event by its ID
      operationId: getEventById
      security:
        - oauth2: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: Event ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Event retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Event
      summary: Update event
      description: Updates an existing event
      operationId: updateEvent
      security:
        - oauth2: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: Event ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 1000
                  description: Short event name
                  example: New Year Eve Party
                description:
                  type: string
                  maxLength: 1000
                  description: Event description
                  example: Annual swimming competition for kids
                eventDate:
                  type: string
                  format: date
                  description: Event date
                  example: '2026-06-15'
                ageFrom:
                  type: integer
                  format: int32
                  description: Minimum child age for the event
                  example: 3
                ageTo:
                  type: integer
                  format: int32
                  description: Maximum child age for the event
                  example: 7
                picture:
                  type: string
                  format: binary
                  description: Event advertisement picture (JPEG, PNG, WebP)
            encoding:
              picture:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Event updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Event
      summary: Delete event
      description: Deletes an event by its ID
      operationId: deleteEvent
      security:
        - oauth2: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: Event ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Event deleted successfully
        '401':
          description: Unauthorized - valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Role:
      type: string
      enum:
        - PARENT
        - COACH
        - ADMIN
      description: User role

    AuthUserRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: User's password (minimum 8 characters)
          example: SecurePass123!

    AuthUserResponse:
      type: object
      x-class-extra-annotation: "@lombok.Builder"
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        email:
          type: string
          format: email

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    RefreshTokenResponse:
      type: object
      x-class-extra-annotation: "@lombok.Builder"
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    ScheduleCreateRequest:
      type: object
      required:
        - from
        - to
        - trainerId
        - scheduleDate
      properties:
        from:
          type: string
          maxLength: 100
          description: From what time
          example: '13:00:00'
        to:
          type: string
          maxLength: 100
          description: To what time
          example: '14:00:00'
        trainerId:
          type: integer
          format: int64
          example: 25
        scheduleDate:
          type: string
          format: date
          description: Schedule date
          example: '2026-06-15'

    UserRegistrationRequest:
      type: object
      required:
        - role
        - email
        - password
        - firstName
        - lastName
      properties:
        role:
          $ref: '#/components/schemas/Role'
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: User's password (minimum 8 characters)
          example: SecurePass123!
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          description: User's first name
          example: Ivan
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          description: User's last name
          example: Petrov
        middleName:
          type: string
          maxLength: 50
          description: User's middle name (optional)
          example: Sergeevich

    UserRegistrationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: User's full name
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp
          example: '2025-11-07T10:30:00Z'

    UserProfileRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        name:
          type: string
          description: User's full name
          example: Ivan Petrov
        description:
          type: string
          maxLength: 500
          description: Profile description
          example: Experienced parent with two wonderful children
        contents:
          type: array
          items:
            $ref: '#/components/schemas/ProfileContentRequest'

    ProfileContentRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        data:
          type: string
          maxLength: 255

    UserProfileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: User ID
          example: 123
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        name:
          type: string
          description: User's full name
          example: Ivan Petrov
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp
          example: '2025-11-07T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Account last update timestamp
          example: '2025-11-07T10:30:00Z'
        profile:
          $ref: '#/components/schemas/ProfileResponse'

    ProfileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Profile ID
          example: 456
        description:
          type: string
          maxLength: 500
          description: Profile description
          example: Experienced parent with two wonderful children
        hasPhoto:
          type: boolean
          description: Whether the profile has a photo uploaded
        contents:
          type: array
          items:
            $ref: '#/components/schemas/ProfileContentResponse'
    ProfileContentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        data:
          type: string
          maxLength: 255

    ChildRequest:
      type: object
      required:
        - name
        - birthday
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Child's name
          example: Alex
        birthday:
          type: string
          format: date
          description: Child's birthday
          example: '2018-05-15'

    ChildResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Child ID
          example: 1
        name:
          type: string
          description: Child's name
          example: Alex
        birthday:
          type: string
          format: date
          description: Child's birthday
          example: '2018-05-15'
        photo:
          type: string
          format: byte
          description: Child photo
        parent:
          $ref: '#/components/schemas/SearchUserResponse'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2025-11-07T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2025-11-07T10:30:00Z'

    PagedChildResponse:
      type: object
      properties:
        content:
          type: array
          description: List of children in the current page
          items:
            $ref: '#/components/schemas/ChildResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    LinkChildRequest:
      type: object
      required:
        - childId
      properties:
        childId:
          type: integer
          format: int64
          description: Child ID to link
          example: 1

    CoachChildrenResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Coach-children link ID
          example: 1
        coach:
          $ref: '#/components/schemas/SearchUserResponse'
        child:
          $ref: '#/components/schemas/ChildResponse'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2025-11-07T10:30:00Z'

    PagedCoachChildrenResponse:
      type: object
      properties:
        content:
          type: array
          description: List of coach-children links in the current page
          items:
            $ref: '#/components/schemas/CoachChildrenResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    CreateLinkRequestRequest:
      type: object
      properties:
        coachId:
          type: integer
          format: int64
          description: Coach ID to send the request to
          example: 1
        clientId:
          type: integer
          format: int64
          description: Client (user) ID requesting the link. Either clientId or childId must be provided.
          example: 2
        childId:
          type: integer
          format: int64
          description: Child ID requesting the link. Either clientId or childId must be provided.
          example: 1

    CoachLinkRequestResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Link request ID
          example: 1
        coach:
          $ref: '#/components/schemas/SearchUserResponse'
        client:
          $ref: '#/components/schemas/SearchUserResponse'
        child:
          $ref: '#/components/schemas/ChildResponse'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2025-11-07T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2025-11-07T10:30:00Z'

    PagedCoachLinkRequestResponse:
      type: object
      properties:
        content:
          type: array
          description: List of link requests in the current page
          items:
            $ref: '#/components/schemas/CoachLinkRequestResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Error occurrence timestamp
          example: '2025-11-07T10:30:00Z'
        status:
          type: integer
          description: HTTP status code
          example: 400
        error:
          type: string
          description: Error type
          example: Bad Request
        message:
          type: string
          description: Error message
          example: Invalid email format
        path:
          type: string
          description: Request path
          example: /api/user/register
    PageInfo:
      type: object
      description: Pagination metadata
      properties:
        size:
          type: integer
          format: int32
          description: Number of items per page
          example: 20
        number:
          type: integer
          format: int32
          description: Current page number (0-indexed)
          example: 0
        totalElements:
          type: integer
          format: int64
          description: Total number of items across all pages
          example: 100
        totalPages:
          type: integer
          format: int32
          description: Total number of pages
          example: 5
        first:
          type: boolean
          description: Indicates whether this is the first page
          example: true
        last:
          type: boolean
          description: Indicates whether this is the last page
          example: false

    PagedUserResponse:
      type: object
      properties:
        content:
          type: array
          description: List of users in the current page
          items:
            $ref: '#/components/schemas/SearchUserResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    SearchUserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: User ID
          example: 123
        email:
          type: string
          format: email
        name:
          type: string
          description: User's full name

    DictServiceRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Dictionary service name
          example: Swimming lessons

    DictServiceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Dictionary service ID
          example: 1
        name:
          type: string
          description: Dictionary service name
          example: Swimming lessons
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2025-11-07T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2025-11-07T10:30:00Z'

    PagedDictServiceResponse:
      type: object
      properties:
        content:
          type: array
          description: List of dictionary services in the current page
          items:
            $ref: '#/components/schemas/DictServiceResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    DictServicePlaceRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Dictionary service place name
          example: Swimming pool

    DictServicePlaceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Dictionary service place ID
          example: 1
        name:
          type: string
          description: Dictionary service place name
          example: Swimming pool
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2025-11-07T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2025-11-07T10:30:00Z'

    PagedDictServicePlaceResponse:
      type: object
      properties:
        content:
          type: array
          description: List of dictionary service places in the current page
          items:
            $ref: '#/components/schemas/DictServicePlaceResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    CoachServiceRequest:
      type: object
      required:
        - userId
        - dictServiceId
        - costOneTime
        - costMembership
        - salary
      properties:
        userId:
          type: integer
          format: int64
          description: Coach user ID
          example: 1
        dictServiceId:
          type: integer
          format: int64
          description: Dictionary service ID
          example: 1
        costOneTime:
          type: number
          format: double
          minimum: 0
          description: Cost for one-time service
          example: 1500.00
        costMembership:
          type: number
          format: double
          minimum: 0
          description: Cost for membership
          example: 5000.00
        salary:
          type: number
          format: double
          minimum: 0
          description: Coach salary for this service
          example: 1000.00

    CoachServiceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Coach service ID
          example: 1
        user:
          $ref: '#/components/schemas/SearchUserResponse'
        dictService:
          $ref: '#/components/schemas/DictServiceResponse'
        costOneTime:
          type: number
          format: double
          description: Cost for one-time service
          example: 1500.00
        costMembership:
          type: number
          format: double
          description: Cost for membership
          example: 5000.00
        salary:
          type: number
          format: double
          description: Coach salary for this service
          example: 1000.00
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2025-11-07T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2025-11-07T10:30:00Z'

    PagedCoachServiceResponse:
      type: object
      properties:
        content:
          type: array
          description: List of coach services in the current page
          items:
            $ref: '#/components/schemas/CoachServiceResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    ScheduleResponse:
      type: object
      x-class-extra-annotation: "@lombok.Builder"
      properties:
        id:
          type: integer
          format: int64
          description: Schedule ID
          example: 1
        trainerId:
          type: integer
          format: int64
          description: Trainer user ID
          example: 25
        trainerName:
          type: string
          description: Trainer full name
          example: 'Иванов Иван'
        scheduleDate:
          type: string
          format: date
          description: Schedule date
          example: '2026-06-15'
        from:
          type: string
          description: Start time
          example: '13:00:00'
        to:
          type: string
          description: End time
          example: '14:00:00'
        status:
          type: string
          description: Schedule status (ACTIVE or EXPIRED)
          example: 'ACTIVE'

    PagedScheduleResponse:
      type: object
      properties:
        content:
          type: array
          description: List of schedules in the current page
          items:
            $ref: '#/components/schemas/ScheduleResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    EventResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Event ID
          example: 1
        name:
          type: string
          description: Short event name
          example: New Year Eve Party
        description:
          type: string
          description: Event description
          example: Annual swimming competition for kids
        eventDate:
          type: string
          format: date
          description: Event date
          example: '2026-06-15'
        ageFrom:
          type: integer
          format: int32
          description: Minimum child age for the event
          example: 3
        ageTo:
          type: integer
          format: int32
          description: Maximum child age for the event
          example: 7
        picture:
          type: string
          format: byte
          description: Event advertisement picture (Base64 encoded)
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2025-11-07T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2025-11-07T10:30:00Z'

    PagedEventResponse:
      type: object
      properties:
        content:
          type: array
          description: List of events in the current page
          items:
            $ref: '#/components/schemas/EventResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth2 security scheme for Planet Childhood API
      flows:
        clientCredentials:
          tokenUrl: https://auth.planetchildhood.ru/oauth/token
          scopes: {}